name: Tích hợp liên tục (Continuous Integration)

on: [push, pull_request]  # Khi có đẩy code lên hoặc yêu cầu kéo (push or pull request)

jobs:
  test:  # Công việc kiểm thử (test job)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Lấy mã nguồn (checkout code)
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - run: npm ci              # Cài đặt chính xác theo lockfile (clean install)
      - run: npm run lint        # Kiểm tra cú pháp (linting)
      - run: npm test            # Chạy kiểm thử (run tests)
      - run: docker build -t app .  # Xây dựng ảnh Docker (build Docker image)
